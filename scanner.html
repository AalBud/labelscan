<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Mix Vendors — Label Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js"></script>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#2a313c; --txt:#e6edf3; --dim:#8b949e;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#58a6ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:10px;padding-bottom:40px}
  h1{font-size:16px;margin:0;letter-spacing:.3px}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .pill{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:20px;
        background:#21262d;border:1px solid var(--line);white-space:nowrap}
  .pill.on{color:var(--ok);border-color:#1f6f34}
  .pill.busy{color:var(--warn);border-color:#6b5514}
  .pill.err{color:var(--bad);border-color:#7d2725}

  /* camera */
  .cam{position:relative;background:#000;border-radius:12px;overflow:hidden;
       border:1px solid var(--line);aspect-ratio:4/3}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .guide{position:absolute;left:6%;right:6%;top:38%;height:24%;
         border:2px solid rgba(88,166,255,.9);border-radius:8px;
         box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .guide span{position:absolute;top:-22px;left:0;font-size:11px;color:#cfe4ff}
  .camctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
  .camctl button{background:rgba(0,0,0,.6);border:1px solid var(--line);color:var(--txt);
                 border-radius:8px;padding:7px 10px;font-size:12px}

  /* result */
  .res{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--dim);
        word-break:break-all;min-height:18px}
  .dno{font-size:46px;font-weight:800;letter-spacing:2px;line-height:1.05;margin:2px 0 4px}
  .dno.none{color:var(--dim);font-size:26px;font-weight:600}
  .meta{font-size:12px;color:var(--dim)}
  .serials{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .chip{background:#1f6f34;color:#fff;font-weight:700;font-size:22px;
        padding:8px 14px;border-radius:9px;min-width:52px;text-align:center}
  .grp{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .grp:first-child{border-top:0;padding-top:0;margin-top:0}
  .gt{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.5px}
  .empty{color:var(--warn);font-size:14px;margin-top:8px}

  /* history */
  h2{font-size:12px;color:var(--dim);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase}
  td.n{font-family:ui-monospace,Menlo,monospace}

  /* setup + gate */
  .cover{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
         justify-content:center;padding:20px;z-index:50}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:22px;width:100%;max-width:420px}
  label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
  input{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);
        background:#0d1117;color:var(--txt);font-size:15px}
  button.primary{margin-top:16px;width:100%;padding:12px;border:0;border-radius:9px;
                 background:var(--accent);color:#04121f;font-weight:700;font-size:15px}
  .hint{font-size:12px;color:var(--dim);margin-top:12px;line-height:1.5}
  .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
  .hide{display:none!important}
</style>
</head>
<body>

<!-- ============ EDIT THESE THREE LINES TO SKIP THE SETUP SCREEN ============ -->
<script>
const CONFIG = {
  apiUrl : '',   // the Apps Script /exec URL
  token  : '',   // must equal API_TOKEN in ScannerApi.gs
  pin    : ''    // optional extra gate, e.g. '4821'. Leave '' for none.
};
</script>
<!-- ======================================================================== -->

<!-- gate -->
<div class="cover" id="gate">
  <div class="card">
    <h1>Mix Vendors — Label Scanner</h1>
    <div id="gateSetup">
      <label>Apps Script web app URL</label>
      <input id="inUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
      <label>API token</label>
      <input id="inTok" type="password" placeholder="matches API_TOKEN" autocomplete="off">
    </div>
    <div id="gatePin" class="hide">
      <label>PIN</label>
      <input id="inPin" type="password" inputmode="numeric" autocomplete="off">
    </div>
    <button class="primary" id="btnGo">Connect</button>
    <div class="err" id="gateErr"></div>
    <div class="hint">
      Nothing is stored on this device. The token is sent only to your own Apps Script
      endpoint, which is read-only and cannot change the sheet.
    </div>
  </div>
</div>

<div class="wrap hide" id="app">
  <div class="bar">
    <h1>Label Scanner</h1>
    <span class="pill" id="status">starting…</span>
  </div>

  <div class="cam">
    <video id="vid" playsinline muted autoplay></video>
    <div class="guide"><span>hold the printed code inside this box</span></div>
    <div class="camctl">
      <button id="btnTorch" class="hide">Light</button>
      <button id="btnType">Type</button>
    </div>
  </div>

  <div class="res">
    <div class="code" id="raw">—</div>
    <div class="dno none" id="dno">waiting for a label</div>
    <div class="meta" id="meta"></div>
    <div id="out"></div>
  </div>

  <h2>Recent scans</h2>
  <table>
    <thead><tr><th>Time</th><th>D.No.</th><th>Tab</th><th>Serials</th></tr></thead>
    <tbody id="hist"></tbody>
  </table>
</div>

<canvas id="cv" class="hide"></canvas>

<script>
"use strict";
const $ = id => document.getElementById(id);
const state = { url:'', token:'', index:null, worker:null,
                lastAccepted:'', pending:'', pendingHits:0, busy:false, seen:new Set() };

/* ---------------------------------------------------------------- gate */
function showGate(){
  if (CONFIG.apiUrl && CONFIG.token){
    $('gateSetup').classList.add('hide');
    if (CONFIG.pin){ $('gatePin').classList.remove('hide'); $('btnGo').textContent='Unlock'; }
    else { start(CONFIG.apiUrl, CONFIG.token); return; }
  }
}
$('btnGo').onclick = () => {
  $('gateErr').textContent='';
  if (CONFIG.apiUrl && CONFIG.token){
    if (CONFIG.pin && $('inPin').value !== CONFIG.pin){ $('gateErr').textContent='Wrong PIN.'; return; }
    start(CONFIG.apiUrl, CONFIG.token);
  } else {
    const u=$('inUrl').value.trim(), t=$('inTok').value.trim();
    if(!u||!t){ $('gateErr').textContent='Both fields are required.'; return; }
    start(u,t);
  }
};
showGate();

/* ------------------------------------------------- API (JSONP, no CORS) */
function api(params){
  return new Promise((resolve,reject)=>{
    const cb = 'cb_' + Math.random().toString(36).slice(2);
    const q  = new URLSearchParams(Object.assign({token:state.token, callback:cb}, params));
    const s  = document.createElement('script');
    const timer = setTimeout(()=>{ cleanup(); reject(new Error('timeout')); }, 25000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); resolve(d); };
    s.onerror = () => { cleanup(); reject(new Error('network')); };
    s.src = state.url + (state.url.includes('?')?'&':'?') + q.toString();
    document.body.appendChild(s);
  });
}

/* ---------------------------------------------------------------- boot */
async function start(url, token){
  state.url = url; state.token = token;
  $('gate').classList.add('hide'); $('app').classList.remove('hide');
  try{
    setStatus('loading sheet…','busy');
    const r = await api({action:'index'});
    if(!r.ok) throw new Error(r.error||'refused');
    state.index = r.index;
    const codes = Object.keys(state.index).length;
    let rows=0; for(const k in state.index) rows += state.index[k].length;
    setStatus(codes+' codes / '+rows+' rows','on');
    $('meta').textContent = 'Loaded '+rows+' rows across '+codes+' D.No. values.';
  }catch(e){
    setStatus('sheet failed','err');
    $('gate').classList.remove('hide'); $('app').classList.add('hide');
    $('gateErr').textContent = 'Could not reach the sheet ('+e.message+'). Check the URL and token.';
    return;
  }
  await initCamera();
  await initOcr();
  loop();
}
function setStatus(t,c){ const p=$('status'); p.textContent=t; p.className='pill'+(c?' '+c:''); }

/* --------------------------------------------------------------- camera */
let track=null;
async function initCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} },
      audio:false
    });
    $('vid').srcObject = stream;
    track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch){
      const b=$('btnTorch'); b.classList.remove('hide');
      let on=false;
      b.onclick=()=>{ on=!on; track.applyConstraints({advanced:[{torch:on}]});
                      b.style.color = on ? '#ffd166' : ''; };
    }
    await $('vid').play();
  }catch(e){
    setStatus('no camera','err');
    $('meta').textContent='Camera blocked. The page must be served over HTTPS and given permission.';
  }
}

/* ------------------------------------------------------------------ ocr */
async function initOcr(){
  setStatus('loading OCR…','busy');
  state.worker = await Tesseract.createWorker('eng');
  await state.worker.setParameters({
    tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
    tessedit_pageseg_mode:'7'                       // one text line
  });
  setStatus('scanning','on');
}

/** Crop the guide band, upscale, grey-out and harden the contrast. */
function grabFrame(){
  const v=$('vid'); if(!v.videoWidth) return null;
  const gx=0.06, gw=0.88, gy=0.38, gh=0.24;
  const sx=v.videoWidth*gx, sw=v.videoWidth*gw;
  const sy=v.videoHeight*gy, sh=v.videoHeight*gh;
  const scale=2, cv=$('cv');
  cv.width=sw*scale; cv.height=sh*scale;
  const c=cv.getContext('2d',{willReadFrequently:true});
  c.drawImage(v, sx,sy,sw,sh, 0,0,cv.width,cv.height);
  const img=c.getImageData(0,0,cv.width,cv.height), d=img.data;
  let sum=0;
  for(let i=0;i<d.length;i+=4){
    const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    d[i]=d[i+1]=d[i+2]=g; sum+=g;
  }
  const mid=sum/(d.length/4);
  for(let i=0;i<d.length;i+=4){
    const g=d[i], t=g>mid*0.92?255:(g<mid*0.62?0:g);
    d[i]=d[i+1]=d[i+2]=t;
  }
  c.putImageData(img,0,0);
  return cv;
}

/* ---------------------------------------------------------- code parsing */
/**
 * Labels come in two shapes:
 *   packing slip  AMY 005 1294 08 192 321 25   -> 4-digit D.No. at digits[3..7]
 *   generated     AM  027 001294 07 179 26     -> 6-digit D.No. at digits[3..9]
 * Both are tried and whichever exists in the sheet wins.
 */
function codesIn(text){
  const clean = text.toUpperCase().replace(/[^A-Z0-9\n ]/g,' ');
  const out=[];
  for (const tok of clean.split(/[\s\n]+/)){
    if (/^[A-Z]{2,5}[0-9]{9,}$/.test(tok)) out.push(tok);
  }
  return out;
}
function designCandidates(code){
  const m = code.match(/^([A-Z]{2,5})([0-9]+)$/); if(!m) return [];
  const dg = m[2], out=[];
  const strip = s => { const t=s.replace(/^0+/,''); return t===''?'0':t; };
  if (dg.length>=7) out.push({key:strip(dg.slice(3,7)),  raw:dg.slice(3,7),  kind:'4-digit'});
  if (dg.length>=9) out.push({key:strip(dg.slice(3,9)),  raw:dg.slice(3,9),  kind:'6-digit'});
  return out;
}
function resolve(code){
  const m = code.match(/^([A-Z]{2,5})([0-9]+)$/); if(!m) return null;
  const pref = m[1];
  const cands = designCandidates(code).map(c => {
    c.rows = state.index[c.key] || []; return c;
  });
  const hit = cands.filter(c => c.rows.length);
  if (!hit.length) return cands.length ? cands[0] : null;
  if (hit.length === 1) return hit[0];
  // Both readings found something. The vendor prefix breaks the tie: a
  // generated label starts with the tab's short name (AM…), a packing-slip
  // label with the 3-letter init (AMY…), and "AMY" still relates to tab "AM".
  const related = c => c.rows.some(r =>
      r.t === pref || pref.startsWith(r.t) || r.t.startsWith(pref));
  return hit.find(related) || hit[0];
}

/* ----------------------------------------------------------------- loop */
async function loop(){
  if(!state.busy && state.worker){
    state.busy=true;
    try{
      const cv=grabFrame();
      if(cv){
        const {data} = await state.worker.recognize(cv);
        const found = codesIn(data.text||'');
        if(found.length){
          const code=found[0];
          // require the same read twice running before trusting it
          if(code===state.pending){ state.pendingHits++; }
          else { state.pending=code; state.pendingHits=1; }
          if(state.pendingHits>=2 && code!==state.lastAccepted) accept(code);
        }
      }
    }catch(e){ /* a bad frame is not worth reporting */ }
    state.busy=false;
  }
  setTimeout(loop, 700);
}

/* --------------------------------------------------------------- render */
function accept(code){
  state.lastAccepted=code;
  const r=resolve(code);
  $('raw').textContent=code;
  if(!r){ $('dno').className='dno none'; $('dno').textContent='unreadable'; $('out').innerHTML=''; return; }

  $('dno').className='dno'; $('dno').textContent=r.key;
  $('meta').textContent = r.kind+' field  ·  read as '+r.raw+
                          '  ·  '+r.rows.length+' matching row'+(r.rows.length===1?'':'s');

  if(!r.rows.length){
    $('out').innerHTML='<div class="empty">No D.No. '+r.key+' in the sheet.</div>';
    beep(220,180); return;
  }
  const byTab={};
  for(const row of r.rows) (byTab[row.t]=byTab[row.t]||[]).push(row);
  const pref=(code.match(/^[A-Z]+/)||[''])[0];
  const tabs=Object.keys(byTab).sort((a,b)=>{
    const sa=pref.startsWith(a)||a.startsWith(pref)?0:1;
    const sb=pref.startsWith(b)||b.startsWith(pref)?0:1;
    return sa-sb || a.localeCompare(b);
  });
  let html='';
  for(const t of tabs){
    const rows=byTab[t].slice().sort((a,b)=>Number(a.s)-Number(b.s));
    html+='<div class="grp"><div class="gt">'+esc(t)+' · '+esc(String(rows[0].d))+
          ' · '+rows.length+' pc</div><div class="serials">'+
          rows.map(x=>'<div class="chip">'+esc(String(x.s))+'</div>').join('')+
          '</div></div>';
  }
  $('out').innerHTML=html;
  addHistory(r.key, tabs.map(t=>t+': '+byTab[t].map(x=>x.s).join(', ')).join('  |  '), tabs.join(', '));
  beep(880,110);
}
function esc(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function addHistory(dno, serials, tab){
  const key=dno+'|'+tab;
  if(state.seen.has(key)) return;              // never list the same label twice
  state.seen.add(key);
  const tr=document.createElement('tr');
  const now=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  tr.innerHTML='<td class="n">'+now+'</td><td class="n">'+esc(dno)+'</td><td>'+esc(tab)+
               '</td><td class="n">'+esc(serials)+'</td>';
  $('hist').prepend(tr);
}

let ac=null;
function beep(freq,ms){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.frequency.value=freq; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(.05,ac.currentTime); o.start();
    o.stop(ac.currentTime+ms/1000);
  }catch(e){}
}

/* ------------------------------------------------------ manual fallback */
$('btnType').onclick=()=>{
  const v=prompt('Type the code or just the D.No.');
  if(!v) return;
  const s=v.trim().toUpperCase();
  if(/^[A-Z]{2,5}[0-9]{9,}$/.test(s)){ state.lastAccepted=''; accept(s); return; }
  const key=s.replace(/\D/g,'').replace(/^0+/,'')||'0';
  const rows=state.index[key]||[];
  state.lastAccepted='';
  $('raw').textContent='(typed) '+s;
  accept_fromKey(key, rows);
};
function accept_fromKey(key, rows){
  $('dno').className='dno'; $('dno').textContent=key;
  $('meta').textContent='typed  ·  '+rows.length+' matching row'+(rows.length===1?'':'s');
  if(!rows.length){ $('out').innerHTML='<div class="empty">No D.No. '+key+' in the sheet.</div>'; return; }
  const byTab={}; for(const r of rows) (byTab[r.t]=byTab[r.t]||[]).push(r);
  let html='';
  for(const t of Object.keys(byTab).sort()){
    const rs=byTab[t].slice().sort((a,b)=>Number(a.s)-Number(b.s));
    html+='<div class="grp"><div class="gt">'+esc(t)+' · '+esc(String(rs[0].d))+' · '+rs.length+
          ' pc</div><div class="serials">'+rs.map(x=>'<div class="chip">'+esc(String(x.s))+
          '</div>').join('')+'</div></div>';
  }
  $('out').innerHTML=html;
  addHistory(key, Object.keys(byTab).map(t=>t+': '+byTab[t].map(x=>x.s).join(', ')).join('  |  '),
             Object.keys(byTab).join(', '));
}
</script>
</body>
</html>
