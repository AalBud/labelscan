<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Mix Vendors — Label Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js"></script>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--line:#2a313c;--txt:#e6edf3;--dim:#8b949e;
        --ok:#3fb950;--warn:#d29922;--bad:#f85149;--accent:#58a6ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:10px 10px 40px}
  h1{font-size:16px;margin:0}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .pill{font-size:12px;padding:4px 9px;border-radius:20px;background:#21262d;
        border:1px solid var(--line);white-space:nowrap}
  .pill.on{color:var(--ok);border-color:#1f6f34}
  .pill.busy{color:var(--warn);border-color:#6b5514}
  .pill.err{color:var(--bad);border-color:#7d2725}
  .spacer{margin-left:auto}

  .cam{position:relative;background:#000;border-radius:12px;overflow:hidden;
       border:1px solid var(--line);aspect-ratio:4/3}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .guide{position:absolute;left:4%;right:4%;top:30%;height:40%;pointer-events:none;
         border:2px solid rgba(88,166,255,.85);border-radius:8px}
  .scanline{position:absolute;left:0;right:0;height:2px;background:rgba(88,166,255,.7);
            animation:sweep 2s linear infinite}
  @keyframes sweep{0%{top:0}100%{top:100%}}
  .camctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .camctl button{background:rgba(0,0,0,.65);border:1px solid var(--line);color:var(--txt);
                 border-radius:8px;padding:8px 11px;font-size:12px}
  .live{position:absolute;left:8px;bottom:8px;right:90px;font:11px/1.3 ui-monospace,Menlo,monospace;
        color:#9fe8b0;background:rgba(0,0,0,.6);padding:5px 7px;border-radius:6px;
        max-height:46px;overflow:hidden;word-break:break-all}

  .res{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--dim);word-break:break-all;min-height:18px}
  .dno{font-size:46px;font-weight:800;letter-spacing:2px;line-height:1.05;margin:2px 0 4px}
  .dno.none{color:var(--dim);font-size:24px;font-weight:600}
  .meta{font-size:12px;color:var(--dim)}
  .serials{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .chip{background:#1f6f34;color:#fff;font-weight:700;font-size:22px;padding:8px 14px;
        border-radius:9px;min-width:52px;text-align:center}
  .grp{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .grp:first-child{border-top:0;padding-top:0;margin-top:0}
  .gt{font-size:12px;color:var(--accent);font-weight:700}
  .empty{color:var(--warn);font-size:14px;margin-top:8px}
  .alts{margin-top:9px;font-size:12px;color:var(--dim)}
  .alts b{color:var(--txt);cursor:pointer;border-bottom:1px dotted var(--dim);margin-right:9px}

  h2{font-size:12px;color:var(--dim);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase}
  td.n{font-family:ui-monospace,Menlo,monospace}

  .cover{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
         justify-content:center;padding:20px;z-index:50}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:420px}
  label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
  input{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);
        background:#0d1117;color:var(--txt);font-size:15px}
  button.primary{margin-top:16px;width:100%;padding:12px;border:0;border-radius:9px;
                 background:var(--accent);color:#04121f;font-weight:700;font-size:15px}
  .hint{font-size:12px;color:var(--dim);margin-top:12px;line-height:1.5}
  .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
  .ver{position:absolute;right:14px;bottom:10px;font:700 12px ui-monospace,Menlo,monospace;
       color:var(--accent);letter-spacing:1px;opacity:.85}
  .card{position:relative}
  .hide{display:none!important}
</style>
</head>
<body>

<!-- ============ EDIT THESE THREE LINES TO SKIP THE SETUP SCREEN ============ -->
<script>
const CONFIG = { apiUrl:'', token:'', pin:'' };
</script>
<!-- ======================================================================== -->

<div class="cover" id="gate">
  <div class="card">
    <h1>Mix Vendors — Label Scanner</h1>
    <div id="gateSetup">
      <label>Apps Script web app URL</label>
      <input id="inUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
      <label>API token</label>
      <input id="inTok" type="password" autocomplete="off">
    </div>
    <div id="gatePin" class="hide">
      <label>PIN</label><input id="inPin" type="password" inputmode="numeric" autocomplete="off">
    </div>
    <button class="primary" id="btnGo">Connect</button>
    <div class="err" id="gateErr"></div>
    <div class="hint">Read-only. Nothing is stored on this device.</div>
    <div class="ver">V3</div>
  </div>
</div>

<div class="wrap hide" id="app">
  <div class="bar">
    <h1>Label Scanner <span style="color:var(--accent);font-size:11px">V3</span></h1>
    <span class="pill spacer" id="status">starting…</span>
    <span class="pill" id="tick">–</span>
  </div>

  <div class="cam">
    <video id="vid" playsinline muted autoplay></video>
    <div class="guide"><div class="scanline"></div></div>
    <div class="live" id="live">warming up…</div>
    <div class="camctl">
      <button id="btnTorch" class="hide">Light</button>
      <button id="btnWide">Full frame</button>
      <button id="btnClear">Clear</button>
      <button id="btnType">Type</button>
    </div>
  </div>

  <div class="res">
    <div class="code" id="raw">—</div>
    <div class="dno none" id="dno">point at a label</div>
    <div class="meta" id="meta"></div>
    <div id="out"></div>
    <div class="alts" id="alts"></div>
  </div>

  <h2>Recent scans</h2>
  <table>
    <thead><tr><th>Time</th><th>D.No.</th><th>Tab</th><th>Serials</th></tr></thead>
    <tbody id="hist"></tbody>
  </table>
</div>

<canvas id="cv" class="hide"></canvas>

<script>
"use strict";
const $=id=>document.getElementById(id);
const S={url:'',token:'',index:null,tabs:null,worker:null,busy:false,
         lastKey:'',lastAt:0,cycles:0,wide:false,detector:null,seen:new Set(),
         streakKey:'',streak:0};

const RESCAN_MS = 4000;   // after this, the same label may be reported again

/* ------------------------------------------------------------------ gate */
function showGate(){
  if(CONFIG.apiUrl&&CONFIG.token){
    $('gateSetup').classList.add('hide');
    if(CONFIG.pin){$('gatePin').classList.remove('hide');$('btnGo').textContent='Unlock';}
    else start(CONFIG.apiUrl,CONFIG.token);
  }
}
$('btnGo').onclick=()=>{
  $('gateErr').textContent='';
  if(CONFIG.apiUrl&&CONFIG.token){
    if(CONFIG.pin&&$('inPin').value!==CONFIG.pin){$('gateErr').textContent='Wrong PIN.';return;}
    start(CONFIG.apiUrl,CONFIG.token);
  }else{
    const u=$('inUrl').value.trim(),t=$('inTok').value.trim();
    if(!u||!t){$('gateErr').textContent='Both fields are required.';return;}
    start(u,t);
  }
};
showGate();

/* ------------------------------------------------------------------- api */
function api(params){
  return new Promise((res,rej)=>{
    const cb='cb_'+Math.random().toString(36).slice(2);
    const q=new URLSearchParams(Object.assign({token:S.token,callback:cb},params));
    const s=document.createElement('script');
    const t=setTimeout(()=>{done();rej(new Error('timeout'))},25000);
    function done(){clearTimeout(t);delete window[cb];s.remove();}
    window[cb]=d=>{done();res(d)};
    s.onerror=()=>{done();rej(new Error('network'))};
    s.src=S.url+(S.url.includes('?')?'&':'?')+q.toString();
    document.body.appendChild(s);
  });
}

/* ------------------------------------------------------------------ boot */
async function start(url,token){
  S.url=url;S.token=token;
  $('gate').classList.add('hide');$('app').classList.remove('hide');
  try{
    setStatus('loading sheet…','busy');
    const r=await api({action:'index'});
    if(!r.ok) throw new Error(r.error||'refused');
    S.index=r.index;
    S.tabs=new Set();
    let rows=0;
    for(const k in S.index){ rows+=S.index[k].length;
      for(const x of S.index[k]) S.tabs.add(String(x.t).toUpperCase()); }
    setStatus(Object.keys(S.index).length+' codes','on');
    $('meta').textContent='Loaded '+rows+' rows across '+S.tabs.size+' designers.';
  }catch(e){
    setStatus('sheet failed','err');
    $('gate').classList.remove('hide');$('app').classList.add('hide');
    $('gateErr').textContent='Could not reach the sheet ('+e.message+').';
    return;
  }
  await initCamera();
  initBarcode();
  initOcr();               // not awaited: barcode scanning starts immediately
  loop();
  watchdog();
}
function setStatus(t,c){const p=$('status');p.textContent=t;p.className='pill'+(c?' '+c:'')}

/* ---------------------------------------------------------------- camera */
let track=null;
async function initCamera(){
  try{
    const st=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    const v=$('vid'); v.srcObject=st; track=st.getVideoTracks()[0];
    const caps=track.getCapabilities?track.getCapabilities():{};
    if(caps.torch){
      const b=$('btnTorch');b.classList.remove('hide');let on=false;
      b.onclick=()=>{on=!on;track.applyConstraints({advanced:[{torch:on}]});b.style.color=on?'#ffd166':''};
    }
    if(caps.focusMode&&caps.focusMode.includes('continuous'))
      track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
    await v.play();
    // a paused video is the classic "frozen camera" - bring it straight back
    v.addEventListener('pause',()=>v.play().catch(()=>{}));
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) v.play().catch(()=>{}); });
  }catch(e){
    setStatus('no camera','err');
    $('meta').textContent='Camera blocked ('+e.name+'). Needs HTTPS and permission.';
  }
}

/* -------------------------------------------------- native barcode reader */
function initBarcode(){
  if(!('BarcodeDetector' in window)) return;
  try{
    S.detector=new BarcodeDetector({formats:[
      'code_128','code_39','code_93','codabar','ean_13','ean_8','itf',
      'upc_a','upc_e','qr_code','data_matrix','pdf417','aztec']});
  }catch(e){ S.detector=null; }
}

/* ------------------------------------------------------------------- ocr */
async function initOcr(){
  try{
    S.worker=await Tesseract.createWorker('eng');
    await S.worker.setParameters({tessedit_pageseg_mode:'6'});   // uniform block
    setStatus('scanning','on');
  }catch(e){ setStatus('OCR failed','err'); }
}

function grabFrame(wide){
  const v=$('vid'); if(!v.videoWidth) return null;
  const g = wide ? {x:0,y:0,w:1,h:1} : {x:0.04,y:0.30,w:0.92,h:0.40};
  const sx=v.videoWidth*g.x, sw=v.videoWidth*g.w;
  const sy=v.videoHeight*g.y, sh=v.videoHeight*g.h;
  const cv=$('cv');
  const target=1000;                              // cap the work so phones keep up
  const scale=Math.min(2.5, Math.max(1, target/sw));
  cv.width=Math.round(sw*scale); cv.height=Math.round(sh*scale);
  const c=cv.getContext('2d',{willReadFrequently:true});
  c.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
  const img=c.getImageData(0,0,cv.width,cv.height),d=img.data;
  let sum=0;
  for(let i=0;i<d.length;i+=4){
    const g2=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    d[i]=d[i+1]=d[i+2]=g2; sum+=g2;
  }
  const mid=sum/(d.length/4);
  for(let i=0;i<d.length;i+=4){
    const t=d[i]>mid*0.95?255:0;                  // hard threshold: printed black on white
    d[i]=d[i+1]=d[i+2]=t;
  }
  c.putImageData(img,0,0);
  return cv;
}

/* ========================= MATCHING AND VALIDATION =======================
   A real label is  LETTERS + 3-digit serial + D.No. + month + cost + year.
   Four things must all hold before a camera read is accepted:

     1. the leading letters name a designer that exists in the sheet
     2. at least MIN_DIGITS digits follow, so a cut-off label is rejected
     3. the D.No. sits at its proper place, straight after the 3-digit serial
     4. the row it matches lives on that same designer's tab

   Random noise off a table cannot satisfy all four, which is what stops the
   phone inventing results when it is put face down.
   ======================================================================== */
const MIN_DIGITS   = 13;   // shortest genuine code seen in the data is 15
const MIN_CONF     = 55;   // Tesseract confidence floor
const CONFIRM_READS= 2;    // identical result needed this many frames running

/** Tidy separators only. Character substitution happens per interpretation. */
function deOcr(s){
  return s.toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
}
/** Letters OCR commonly returns in place of digits. */
function digitize(s){
  return s.replace(/[OQD]/g,'0').replace(/[IL|]/g,'1').replace(/S/g,'5')
          .replace(/B/g,'8').replace(/Z/g,'2').replace(/G/g,'6').replace(/T/g,'7');
}
const strip=s=>{const t=s.replace(/^0+/,'');return t===''?'0':t;};

/**
 * One printed token can be read several ways, because we cannot know where the
 * vendor letters stop and the digits begin once OCR has turned 0 into O.
 * "AMYOO5129…" is AMY+OO5129… or AMYO+O5129…, so every split of 0-5 leading
 * letters is offered and the scoring below decides.
 */
function readings(tok){
  const out=[], seen=new Set();
  for(let n=0;n<=5 && n<=tok.length;n++){
    const pref=tok.slice(0,n), rawTail=tok.slice(n);
    if(!/^[A-Z]*$/.test(pref)) break;      // prefix must be letters only
    if(!rawTail) continue;
    const tail=digitize(rawTail);
    if(!/^[0-9]+$/.test(tail)) continue;
    const subs=(rawTail.match(/[A-Z]/g)||[]).length;
    // A tail that was already all digits can be short (a typed number or a
    // bare barcode). A tail we had to letter-substitute must look like a real
    // printed code, or ordinary words such as PALAZZO turn into numbers.
    const ok = subs===0 ? tail.length>=3
                        : (tail.length>=8 && subs/tail.length<=0.4);
    if(!ok) continue;
    const sig=pref+'|'+tail;
    if(!seen.has(sig)){ seen.add(sig); out.push([pref,tail]); }
  }
  return out;
}

/**
 * Build scored candidates. A window scores higher when it sits where a D.No.
 * normally sits, when the vendor letters point at the same tab, and when the
 * surrounding run looks like a full product code.
 */
/**
 * Do these leading letters name this tab?  AMY↔AM, VAL↔BVAL, HAZ↔CHAZ, AAR↔CAAR
 * — the packing slip drops the first letter of the tab name.
 */
function vendorMatches(pref,tab){
  if(!pref||!tab) return false;
  const P=pref.toUpperCase(), T=tab.toUpperCase(), T1=T.slice(1);
  return P===T || T.startsWith(P) || P.startsWith(T) ||
         P===T1 || T1.startsWith(P) || (T1.length>1 && P.startsWith(T1));
}
function knownVendor(pref){
  if(!S.tabs) return true;
  for(const t of S.tabs) if(vendorMatches(pref,t)) return true;
  return false;
}

/**
 * strict = a camera read, every rule enforced.
 * loose  = typed input or a scanned barcode, where the payload may be just the
 *          number and there are no OCR artefacts to defend against.
 */
function candidates(text,strict){
  const clean=deOcr(text);
  const out=new Map();
  const add=(key,score,why,ctx)=>{
    if(!/^\d+$/.test(key)) return;
    const rows=S.index[key];
    if(!rows||!rows.length) return;
    const prev=out.get(key);
    if(!prev||score>prev.score) out.set(key,{key,score,why,ctx,rows});
  };
  if(strict){
    // ---- the disciplined path: structure must hold, no guessing
    const toks=clean.split(/\s+/).filter(Boolean);
    const joined=[];
    for(let i=0;i<toks.length-1;i++) joined.push(toks[i]+toks[i+1]);
    for(let i=0;i<toks.length-2;i++) joined.push(toks[i]+toks[i+1]+toks[i+2]);
    let reason='';
    for(const tok of toks.concat(joined)){
      for(const [pref,dg] of readings(tok)){
        if(!pref || pref.length<2 || pref.length>5){ reason=reason||'no designer letters'; continue; }
        if(!knownVendor(pref)){ reason=reason||'unknown designer "'+pref+'"'; continue; }
        if(dg.length<MIN_DIGITS){ reason=reason||'partial code ('+dg.length+' digits, need '+MIN_DIGITS+')'; continue; }
        // D.No. only ever starts right after the 3-digit serial
        for(let len=6;len>=3;len--){
          if(3+len>dg.length) continue;
          const win=dg.slice(3,3+len), k=strip(win), rows=S.index[k];
          if(!rows) continue;
          const onVendorTab=rows.filter(r=>vendorMatches(pref,r.t));
          if(!onVendorTab.length){ reason=reason||'D.No. '+k+' is not on '+pref+"'s tab"; continue; }
          add(k, 100+k.length*4, 'D.No. after serial, '+k.length+' digits, '+
                                 onVendorTab[0].t+' confirmed', tok);
        }
      }
    }
    const list=[...out.values()].sort((a,b)=>b.score-a.score);
    // keep only rows belonging to the designer that was actually read
    for(const c of list){
      const p=(c.ctx.match(/^[A-Z]+/)||[''])[0];
      const only=c.rows.filter(r=>vendorMatches(p,r.t));
      if(only.length) c.rows=only;
    }
    list.reason=reason;
    return list;
  }
  const toks=clean.split(/\s+/).filter(Boolean);
  // also try neighbouring tokens joined, in case OCR split the code with a space
  const joined=[];
  for(let i=0;i<toks.length-1;i++) joined.push(toks[i]+toks[i+1]);
  if(toks.length>2) for(let i=0;i<toks.length-2;i++) joined.push(toks[i]+toks[i+1]+toks[i+2]);

  for(const tok of toks.concat(joined)){
  for(const [pref,dg] of readings(tok)){
    const rel=rows=>rows.some(r=>r.t===pref||(pref&&(pref.startsWith(r.t)||r.t.startsWith(pref))));

    // Every window of 3..6 digits, at every offset. No layout is assumed, but
    // offset 3 - straight after the 3-digit serial - is where a D.No. sits in
    // both the packing-slip and the generated formats, so it scores far higher.
    // D.No. length varies by vendor (1294 is 4, 10124 is 5, 010090 is 6), so
    // all lengths are tried at that offset too.
    for(let len=6;len>=3;len--){
      for(let i=0;i+len<=dg.length;i++){
        const win=dg.slice(i,i+len);
        const k=strip(win);
        const r=S.index[k];
        if(!r) continue;
        // score on the EFFECTIVE key, not the raw window: strip("00110") is
        // "110", which must not be treated as a confident 5-digit read.
        let sc = k.length*4;
        if(i===3)                    sc+=50;        // canonical D.No. position
        if(i===0 && win===k)         sc+=6;         // whole run, nothing stripped
        if(rel(r))                   sc+=40;        // vendor letters agree
        if(win!==k)                  sc-=4;         // leading zeros were dropped
        add(k,sc, i===3 ? 'D.No. position ('+k.length+' digits)'
                        : 'digits '+(i+1)+'-'+(i+len)+' of '+dg.length, tok);
      }
    }
  }}
  return [...out.values()].sort((a,b)=>b.score-a.score);
}

/* ------------------------------------------------------------------ loop */
async function loop(){
  const t0=Date.now();
  try{
    if(!S.busy){
      S.busy=true;
      let text='', via='', conf=100;
      // 1. a real barcode is instant and exact, so try it first
      if(S.detector && $('vid').videoWidth){
        try{
          const codes=await S.detector.detect($('vid'));
          if(codes&&codes.length){ text=codes.map(c=>c.rawValue).join(' '); via='barcode'; }
        }catch(e){}
      }
      // 2. otherwise OCR the guide box (or the whole frame if asked)
      if(!text && S.worker){
        const cv=grabFrame(S.wide);
        if(cv){
          const {data}=await S.worker.recognize(cv);
          text=(data&&data.text)||''; conf=(data&&data.confidence)||0; via='ocr';
        }
      }
      S.cycles++;
      const flat=text.replace(/\s+/g,' ').trim();
      $('tick').textContent='#'+S.cycles+' · '+(Date.now()-t0)+'ms';
      if(via==='ocr' && conf && conf<MIN_CONF){
        $('live').textContent='low confidence '+Math.round(conf)+'% — hold steadier';
        S.streakKey=''; S.streak=0;
      }else if(flat){
        consider(flat, via==='barcode');
      }else{
        $('live').textContent='(nothing readable)';
        S.streakKey=''; S.streak=0;
      }
    }
  }catch(e){
    $('live').textContent='error: '+e.message;
  }finally{
    S.busy=false;                         // ALWAYS releases, so the loop cannot wedge
  }
  setTimeout(loop, 500);
}

/** Restart the loop if a cycle ever hangs. */
function watchdog(){
  let last=-1;
  setInterval(()=>{
    if(S.cycles===last && !document.hidden){ S.busy=false; }
    last=S.cycles;
    const v=$('vid'); if(v.srcObject && v.paused) v.play().catch(()=>{});
  },6000);
}

function consider(text, fromBarcode){
  const cs=candidates(text, !fromBarcode);
  if(!cs.length){
    $('live').textContent = (cs.reason ? 'rejected: '+cs.reason : 'no designer code in view')+
                            '  ·  '+text.slice(0,40);
    S.streakKey=''; S.streak=0;
    return;
  }
  const best=cs[0];
  // must read the same thing CONFIRM_READS frames running before it counts
  if(best.key===S.streakKey){ S.streak++; } else { S.streakKey=best.key; S.streak=1; }
  const need = fromBarcode ? 1 : CONFIRM_READS;
  if(S.streak<need){
    $('live').textContent='confirming '+best.key+'  ('+S.streak+'/'+need+')';
    return;
  }
  $('live').textContent='✓ '+text.slice(0,44);
  const now=Date.now();
  if(best.key===S.lastKey && now-S.lastAt<RESCAN_MS) return;   // same label still in view
  S.lastKey=best.key; S.lastAt=now;
  render(text,best,cs.slice(1,5));
}

/* ---------------------------------------------------------------- render */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(raw,best,alts){
  $('raw').textContent=raw.length>90?raw.slice(0,90)+'…':raw;
  $('dno').className='dno'; $('dno').textContent=best.key;
  $('meta').textContent=best.why+'  ·  '+best.rows.length+' row'+(best.rows.length===1?'':'s');
  const byTab={};
  for(const r of best.rows)(byTab[r.t]=byTab[r.t]||[]).push(r);
  let html='';
  for(const t of Object.keys(byTab).sort()){
    const rs=byTab[t].slice().sort((a,b)=>Number(a.s)-Number(b.s));
    html+='<div class="grp"><div class="gt">'+esc(t)+' · '+esc(rs[0].d)+' · '+rs.length+
          ' pc</div><div class="serials">'+
          rs.map(x=>'<div class="chip">'+esc(x.s)+'</div>').join('')+'</div></div>';
  }
  $('out').innerHTML=html;
  $('alts').innerHTML = alts.length
    ? 'Other possible readings: '+alts.map(a=>'<b data-k="'+esc(a.key)+'">'+esc(a.key)+
      ' ('+a.rows.length+')</b>').join('')
    : '';
  [...$('alts').querySelectorAll('b')].forEach(b=>b.onclick=()=>{
    const k=b.getAttribute('data-k');
    const c=candidates(raw,false).find(x=>x.key===k)||{key:k,why:'chosen manually',rows:S.index[k]||[]};
    S.lastKey=k; S.lastAt=Date.now(); render(raw,c,[]);
  });
  addHistory(best.key,Object.keys(byTab).map(t=>t+': '+byTab[t].map(x=>x.s).join(', ')).join(' | '),
             Object.keys(byTab).join(', '));
  beep(880,90);
}
function addHistory(dno,serials,tab){
  const key=dno+'|'+tab;
  if(S.seen.has(key)) return;
  S.seen.add(key);
  const tr=document.createElement('tr');
  tr.innerHTML='<td class="n">'+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})+
    '</td><td class="n">'+esc(dno)+'</td><td>'+esc(tab)+'</td><td class="n">'+esc(serials)+'</td>';
  $('hist').prepend(tr);
}
let ac=null;
function beep(f,ms){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(.05,ac.currentTime);o.start();o.stop(ac.currentTime+ms/1000);}catch(e){}}

/* --------------------------------------------------------------- buttons */
$('btnClear').onclick=()=>{
  S.lastKey='';S.lastAt=0;S.streakKey='';S.streak=0;
  $('raw').textContent='—';$('dno').className='dno none';$('dno').textContent='point at a label';
  $('meta').textContent='';$('out').innerHTML='';$('alts').innerHTML='';
};
$('btnWide').onclick=()=>{
  S.wide=!S.wide;
  $('btnWide').textContent=S.wide?'Guide box':'Full frame';
  document.querySelector('.guide').style.opacity=S.wide?0.25:1;
};
$('btnType').onclick=()=>{
  const v=prompt('Type the full code, or just the design number');
  if(!v) return;
  S.lastKey='';
  const cs=candidates(v,false);
  if(cs.length){ render('(typed) '+v, cs[0], cs.slice(1,5)); return; }
  const k=strip(v.replace(/\D/g,''));
  const rows=S.index[k]||[];
  if(rows.length) render('(typed) '+v,{key:k,why:'typed',rows},[]);
  else{
    $('raw').textContent='(typed) '+v;
    $('dno').className='dno none';$('dno').textContent='no match';
    $('meta').textContent='';$('out').innerHTML='<div class="empty">No D.No. '+esc(k)+' in the sheet.</div>';
    $('alts').innerHTML='';
  }
};
</script>
